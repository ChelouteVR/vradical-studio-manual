<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="VRadical Studio documentation, privacy policy, and terms of use.">
  <link rel="canonical" href="https://cheloutevr.github.io/vradical-studio-manual/">
  <link rel="icon" type="image/png" href="assets/vradical-studio-icon.png">
  <title>VRadical Studio</title>
  <style>
    :root {
      --ink: #f5f8f3;
      --muted: #a8b0a6;
      --line: rgba(215, 255, 199, .16);
      --accent: #bef574;
      --accent-2: #7bf7cb;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 20%, rgba(190, 245, 116, .09), transparent 32rem),
        #050705;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
    }

    main {
      display: grid;
      place-items: center;
      padding: clamp(36px, 7vw, 84px) 24px 46px;
      text-align: center;
    }

    .hero { width: min(720px, 100%); }

    .studio-icon {
      display: block;
      width: min(330px, 62vw);
      height: auto;
      margin: 0 auto 30px;
      border-radius: 22%;
      filter: none;
      box-shadow: 0 35px 100px rgba(0, 0, 0, .55), 0 0 70px rgba(190, 245, 116, .12);
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 76px);
      line-height: .98;
      letter-spacing: -.055em;
    }

    .tagline {
      max-width: 590px;
      margin: 18px auto 30px;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.55;
    }

    .manual-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 0 28px;
      border: 1px solid rgba(190, 245, 116, .55);
      border-radius: 15px;
      color: #0b1008;
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      box-shadow: 0 15px 42px rgba(123, 247, 203, .13);
      font-weight: 850;
      text-decoration: none;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .manual-button:hover { transform: translateY(-2px); box-shadow: 0 20px 50px rgba(123, 247, 203, .2); }
    .manual-button:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 24px;
      padding: 22px 24px 30px;
      border-top: 1px solid var(--line);
      color: #788077;
      font-size: 13px;
    }

    footer a { color: #b9c1b7; text-decoration: none; }
    footer a:hover { color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      .manual-button { transition: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <main>
      <section class="hero" aria-labelledby="page-title">
        <img class="studio-icon" src="assets/vradical-studio-icon.png" alt="VRadical Studio app icon">
        <h1 id="page-title">VRadical Studio</h1>
        <p class="tagline">Professional VR video and photo processing for macOS and Windows.</p>
        <a class="manual-button" href="manual/">Open User Manual</a>
      </section>
    </main>
    <footer>
      <span>&copy; 2026 VRadical Studio</span>
      <a href="privacy/">Privacy Policy</a>
      <a href="terms/">Terms of Use</a>
      <a href="mailto:cheloute.vr@gmail.com">Contact</a>
    </footer>
  </div>
</body>
</html>
